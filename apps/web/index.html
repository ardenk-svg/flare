<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flare (simulation)</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved theme before first paint so the page doesn't flash the other one.
      try { var t = localStorage.getItem("flare-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/flare-mark.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
